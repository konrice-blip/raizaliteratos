<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loops</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🔁%3C/text%3E%3C/svg%3E">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .main-container {
        width: 80%;
        margin: 0 auto;
        padding-top: 20px;
      }
      .back-link {
        display: inline-block;
        text-decoration: none;
        color: black;
        background-color: #e6e6e6;
        padding: 8px 16px;
        border-radius: 8px;
        border: 2px solid rgb(129, 129, 129);
        font-weight: bold;
        margin-bottom: 20px;
        transition: background-color 0.2s ease;
      }
      .back-link:hover {
        background-color: #dcdcdc;
      }
      .input-container {
        background-color: #e6e6e6;
        width: 60%;
        padding: 25px;
        margin: 20px auto 30px auto;
        border-radius: 10px;
        border: 2px solid rgb(129, 129, 129);
      }
      .input-container h2 {
        margin-top: 0;
        text-transform: uppercase;
        font-size: 1.4rem;
      }
      .input-container p {
        color: rgb(78, 76, 76);
      }
      .input {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgb(129, 129, 129);
        font-size: 1rem;
        width: 50%;
      }
      .button {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid rgb(129, 129, 129);
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        background-color: white;
        transition: background-color 0.2s ease;
      }
      .button:hover {
        background-color: #dcdcdc;
      }
      .body-container {
        display: flex;
        flex-direction: column; /* Stacks containers vertically */
        align-items: center;     /* Centers them nicely */
        gap: 20px;
        margin-bottom: 40px;
      }
      .small-container {
        width: 60%;              /* Matches the input box width */
        background-color: #e6e6e6;
        border-radius: 10px;
        padding: 25px 15px;
        border: 2px solid rgb(129, 129, 129);
        box-sizing: border-box;
      }
      .small-container h4 {
        margin-top: 0;
        text-transform: uppercase;
        font-size: 1rem;
      }
      .small-container p {
        color: rgb(78, 76, 76);
        margin-bottom: 8px;
      }
      .answer {
        font-size: 25px;
        font-weight: bold;
        color: black;
        word-break: break-all;     /* Prevents long numbers from stretching the box */
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <a href="index.html" class="back-link">← Back to Home</a>

      <div class="input-container">
        <h2>Loops</h2>
        <p>Input a positive whole number (N)!</p>
        <input type="number" id="input" class="input" placeholder="Enter N..." />
        <button id="button" class="button">Submit</button>
      </div>

      <div class="body-container">
        <div class="small-container">
          <h4>Factorial (While Loop)</h4>
          <p>Answer:</p>
          <span id="factAns" class="answer">0</span>
        </div>
        <div class="small-container">
          <h4>Sum (Do While Loop)</h4>
          <p>Answer:</p>
          <span id="sumAns" class="answer">0</span>
        </div>
        <div class="small-container">
          <h4>Average (For Loop) of First N Numbers</h4>
          <p>Answer:</p>
          <span id="averAns" class="answer">0</span>
        </div>
      </div>
    </div>

    <script>
      const input = document.getElementById("input");
      const button = document.getElementById("button");
      const factorialAnsw = document.getElementById("factAns");
      const sumAnsw = document.getElementById("sumAns");
      const averageAnsw = document.getElementById("averAns");

      function factorial(value) {
        if (value <= 0) {
          factorialAnsw.textContent = 0;
          return 0;
        }
        let i = 1;
        let result = 1n; 
        while (i <= value) {
          result *= BigInt(i);
          i++;
        }
        factorialAnsw.textContent = result.toString();
        return result;
      }

      function sum(value) {
        if (value <= 0) {
          sumAnsw.textContent = 0;
          return 0;
        }
        let i = 1;
        let result = 0;
        do {
          result += i;
          i++;
        } while (i <= value);
        sumAnsw.textContent = result.toLocaleString();
        return result;
      }

      function average(value) {
        if (value <= 0) {
          averageAnsw.textContent = 0;
          return 0;
        }
        let result = 0;
        for (let i = 1; i <= value; i++) {
          result += i;
        }
        const avg = result / value;
        averageAnsw.textContent = avg.toLocaleString();
        return avg;
      }

      button.addEventListener("click", () => {
        const value = Number(input.value);
        average(value);
        sum(value);
        factorial(value);
      });
    </script>
  </body>
</html>
