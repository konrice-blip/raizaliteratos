<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Payroll List</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💼%3C/text%3E%3C/svg%3E">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        .container {
            margin: 0 auto;
        }
        .back-link {
            display: inline-block;
            text-decoration: none;
            color: black;
            background-color: #e6e6e6;
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid rgb(129, 129, 129);
            font-weight: bold;
            margin-bottom: 20px;
            transition: background-color 0.2s ease;
        }
        .back-link:hover {
            background-color: #dcdcdc;
        }
        .table-title {
            font-weight: bold;
            margin: 15px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .input-container, .table-container {
            background-color: #e6e6e6;
            width: 50%;
            padding: 25px;
            margin: 0 auto;
            border-radius: 10px;
            padding-bottom: 30px;
            margin-bottom: 30px;
            border: 2px solid rgb(129, 129, 129);
            margin-top: 20px;
        }
        .table-container {
            width: 80%;
        }
        .table-container table th,
        .table-container table td {
            padding: 10px;
            border-bottom: 1px solid rgb(180, 180, 180);
            text-align: right;
        }
        .table-container table th {
            text-align: center;
            color: black;
        }
        .table-container table tbody tr td {
            color: rgb(78, 76, 76);
        }
        td.left-align {
            text-align: left !important;
        }
        td.center-align {
            text-align: center !important;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: inline-block;
            width: 200px;
            font-weight: bold;
        }
        .input {
            padding: 6px;
            width: 200px;
        }
        .button {
            padding: 6px 14px;
            width: 30%;
            cursor: pointer;
            font-weight: bold;
        }
        .button-clr {
            margin-top: 20px;
            display: block;
        }
        .answer {
            font-size: 25px;
            font-weight: bold;
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h2 style="text-align: center;">Employee Payroll System</h2>

        <!-- 1. Input Section -->
        <div class="input-container">
            <h3>Add Employee</h3>
            <div class="form-group">
                <label for="empName">Employee Name:</label>
                <input type="text" id="empName" class="input" placeholder="e.g., Juan Dela Cruz">
            </div>
            <div class="form-group">
                <label for="daysWorked">Days Worked:</label>
                <input type="number" id="daysWorked" class="input" min="0" step="0.5" placeholder="0">
            </div>
            <div class="form-group">
                <label for="dailyRate">Daily Rate:</label>
                <input type="number" id="dailyRate" class="input" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="deduction">Deduction Amount:</label>
                <input type="number" id="deduction" class="input" min="0" step="0.01" placeholder="0.00">
            </div>
            <button class="button" onclick="addEmployee()">Add to Payroll</button>
        </div>

        <!-- 3. Delete Section -->
        <div class="input-container">
            <h3>Manage Payroll</h3>
            <div class="form-group">
                <label for="lineNo">Line No. to Delete:</label>
                <input type="number" id="lineNo" class="input" min="1" placeholder="Enter No.">
                <div class="button-clr">
                    <button class="button" onclick="deleteEmployee()">Delete</button>
                    <button class="button" onclick="clearList()">Clear All</button>
                </div>
            </div>
        </div>

        <!-- 2. Display Table Section -->
        <div id="tableContainer" class="table-container"></div>
    </div>

    <script>
        let payrollList = [];

        function addEmployee() {
            const name = document.getElementById("empName").value.trim();
            const days = parseFloat(document.getElementById("daysWorked").value);
            const rate = parseFloat(document.getElementById("dailyRate").value);
            const deduction = parseFloat(document.getElementById("deduction").value) || 0;

            if (!name || isNaN(days) || isNaN(rate)) {
                alert("Please enter valid values for Employee Name, Days Worked, and Daily Rate.");
                return;
            }

            const grossPay = days * rate;
            const netPay = grossPay - deduction;

            payrollList.push({
                name: name,
                days: days,
                rate: rate,
                grossPay: grossPay,
                deduction: deduction,
                netPay: netPay
            });

            document.getElementById("empName").value = "";
            document.getElementById("daysWorked").value = "";
            document.getElementById("dailyRate").value = "";
            document.getElementById("deduction").value = "";

            displayTable();
        }

        function deleteEmployee() {
            if (payrollList.length === 0) {
                alert("The payroll list is currently empty.");
                return;
            }

            let lineInput = document.getElementById("lineNo").value;
            if (!lineInput) {
                lineInput = prompt("Enter the Line Number (No.) to delete:");
            }

            const lineNo = parseInt(lineInput, 10);

            if (isNaN(lineNo) || lineNo < 1 || lineNo > payrollList.length) {
                alert("Invalid Line Number. Please enter a number between 1 and " + payrollList.length + ".");
                return;
            }

            const confirmDelete = confirm(`Are you sure you want to delete Line No. ${lineNo} (${payrollList[lineNo - 1].name})?`);
            if (confirmDelete) {
                payrollList.splice(lineNo - 1, 1);
                document.getElementById("lineNo").value = "";
                displayTable();
            }
        }

        function clearList() {
            if (payrollList.length === 0) return;
            if (confirm("Are you sure you want to clear the entire payroll list?")) {
                payrollList = [];
                displayTable();
            }
        }

        function displayTable() {
            const container = document.getElementById("tableContainer");

            if (payrollList.length === 0) {
                container.innerHTML = `<p class="table-title" style="text-align:center;">Employee Payroll List</p><p style="text-align:center;"><em>No employees in the payroll list yet.</em></p>`;
                return;
            }

            let html = `
                <table>
                    <caption class="table-title">Employee Payroll List</caption>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Employee Name</th>
                            <th>Days Worked</th>
                            <th>Daily Rate</th>
                            <th>Gross Pay</th>
                            <th>Deduction Amount</th>
                            <th>Net Pay</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            payrollList.forEach((emp, index) => {
                const lineNumber = index + 1;
                html += `
                    <tr>
                        <td class="center-align">${lineNumber}</td>
                        <td class="left-align">${emp.name}</td>
                        <td>${emp.days}</td>
                        <td>₱ ${emp.rate.toFixed(2)}</td>
                        <td>₱ ${emp.grossPay.toFixed(2)}</td>
                        <td>₱ ${emp.deduction.toFixed(2)}</td>
                        <td><strong>₱ ${emp.netPay.toFixed(2)}</strong></td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        displayTable();
    </script>

</body>
</html>
